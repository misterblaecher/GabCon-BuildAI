name: Dataset sourcing smoke

on:
  push:
    branches: [feature/dataset-sourcing-pipeline]
  workflow_dispatch:

jobs:
  dataset-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Dataset lint
        run: |
          uv run ruff check src/mcbuild/dataset tests/test_dataset_*.py
          uv run ruff format --check src/mcbuild/dataset tests/test_dataset_*.py

      - name: Dataset tests
        run: uv run pytest tests/test_dataset_*.py

      - name: CLI smoke
        run: |
          uv run mcbuild-dataset list-sources
          uv run mcbuild-dataset --help

      - name: Real Hack337 import
        run: |
          uv run mcbuild-dataset source hack337 --limit 1 --workers 1 --data-dir /tmp/mcbuild-data
          uv run mcbuild-dataset status --data-dir /tmp/mcbuild-data
          uv run python - <<'PY'
          import sqlite3
          db = sqlite3.connect('/tmp/mcbuild-data/manifests/downloads.sqlite')
          parsed = db.execute(
              "select count(*) from items where source='hack337' and status='parsed'"
          ).fetchone()[0]
          assert parsed >= 1, (
              f"expected at least one parsed Hack337 structure, got {parsed}"
          )
          PY
