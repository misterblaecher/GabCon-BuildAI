name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check GabCon Studio Python syntax
        run: uv run python -m compileall -q gabcon-studio

      - name: Check GabCon Studio JavaScript syntax
        run: |
          node --check gabcon-studio/static/app.js
          node --check gabcon-studio/static/sw.js

      - name: Lint (ruff)
        run: uv run ruff check src tests tools

      - name: Ruff format diagnostic (temporary)
        run: uv run ruff format --diff src/mcbuild/dsl/stdlib.py || true

      - name: Format check (ruff)
        run: uv run ruff format --check src tests

      - name: Type check (ty)
        continue-on-error: true
        run: uv run ty check src tests

      - name: Test (pytest)
        run: uv run pytest


  mod-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build NeoForge mod
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
