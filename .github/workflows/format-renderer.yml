name: Temporary format renderer

on:
  push:
    branches:
      - feature/chatgpt-blueprint-renderer
    paths:
      - "src/mcbuild/render_cli.py"
      - "tests/test_render_cli.py"
      - ".github/workflows/format-renderer.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install
      - name: Install dev dependencies
        run: uv sync --extra dev
      - name: Format renderer files
        run: uv run ruff format src/mcbuild/render_cli.py tests/test_render_cli.py
      - name: Commit formatting
        shell: bash
        run: |
          git add src/mcbuild/render_cli.py tests/test_render_cli.py
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format blueprint renderer"
          git push
